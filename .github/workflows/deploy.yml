# docx 폴더에 Word 파일을 올리면(push) 자동으로 변환 → 사이트 생성 → GitHub Pages 공개
name: 사이트 만들기와 공개

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
      PANDOC_VERSION: 3.1.3
    steps:
      - uses: actions/checkout@v4
      - name: pandoc · Hugo 설치
        run: |
          wget -q -O pandoc.deb https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb
          wget -q -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i pandoc.deb hugo.deb
      - name: Word 문서 → Markdown 변환
        run: python3 tools/convert.py
      - id: pages
        uses: actions/configure-pages@v5
      - name: 사이트 만들기
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
